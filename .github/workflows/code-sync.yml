name: Code Sync — Context Loading + Code Generation via Claude

on:
  # Called by any QueueTube app repo (queue-tube-web, queue-tube-serverless, …)
  # when a story issue is labeled 'code-ready' or '/code sync' is posted.
  workflow_call:
    inputs:
      source_repo:
        description: "Repo where the issue lives (e.g. spreadcode-dev/queue-tube-web)"
        required: true
        type: string
      issue_number:
        description: "Source story issue number"
        required: true
        type: string
      issue_title:
        description: "Source story issue title"
        required: true
        type: string
      issue_body:
        description: "Source story issue body"
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      GH_PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  generate-code:
    runs-on: ubuntu-latest

    permissions:
      issues: write        # apply labels on queue-tube-web issues via GITHUB_TOKEN
      contents: write      # not used directly — GH_PERSONAL_ACCESS_TOKEN handles queue-tube-web
      pull-requests: write # not used directly — GH_PERSONAL_ACCESS_TOKEN handles queue-tube-web

    env:
      MAX_CONTEXT_TOKENS: "6000"
      # Pipeline repo — holds scripts and docs (this repo, always)
      MCPS_REPO: "spreadcode-dev/queue-tube-mcps"
      # Source app repo — the caller passes this; drives context fetching and delivery
      SOURCE_REPO: ${{ inputs.source_repo }}

    steps:
      - name: Checkout queue-tube-mcps (pipeline scripts)
        uses: actions/checkout@v4
        with:
          repository: spreadcode-dev/queue-tube-mcps
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        run: |
          test -n "$ANTHROPIC_API_KEY"           || { echo "Missing secret: ANTHROPIC_API_KEY"; exit 1; }
          test -n "$GH_PERSONAL_ACCESS_TOKEN"    || { echo "Missing secret: GH_PERSONAL_ACCESS_TOKEN"; exit 1; }

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Load codebase context
        id: context
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          MAX_CONTEXT_TOKENS: ${{ env.MAX_CONTEXT_TOKENS }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_BODY: ${{ inputs.issue_body }}
        run: |
          python scripts/context_loader.py \
            --issue-title "$ISSUE_TITLE" \
            --issue-body  "$ISSUE_BODY" \
            --repo        "$SOURCE_REPO" \
            --max-tokens  "$MAX_CONTEXT_TOKENS" \
            > context_output.txt

          echo "context_file=context_output.txt" >> "$GITHUB_OUTPUT"
          echo "✓ Context saved to context_output.txt"
          wc -c context_output.txt

      - name: Run Code Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
          ISSUE_BODY: ${{ inputs.issue_body }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          MCPS_REPO: ${{ env.MCPS_REPO }}
          MAX_CONTEXT_TOKENS: ${{ env.MAX_CONTEXT_TOKENS }}
          CONTEXT_FILE: ${{ steps.context.outputs.context_file }}
        run: python scripts/code_agent.py
